<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRB JE Prep — CBT-1 Practice</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">RRB JE 2026</p>
        <h1>CBT-1 Practice</h1>
        <p class="subtitle">Current Affairs practice — built for focused revision.</p>
      </div>
      <div class="badge">Current Affairs</div>
    </header>

    <section id="start-screen" class="card">
      <h2>Current Affairs Test</h2>
      <p>10 questions • RRB-style MCQs • Review mistakes after submission</p>
      <button id="start-btn" class="primary">Start Test</button>
    </section>

    <section id="quiz-screen" class="hidden">
      <div class="progress-row">
        <span id="question-count"></span>
        <span id="score-live">0 correct</span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>

      <article class="card question-card">
        <p id="question-topic" class="topic"></p>
        <h2 id="question-text"></h2>
        <div id="options" class="options"></div>
        <div class="nav-row">
          <button id="next-btn" class="primary" disabled>Next</button>
        </div>
      </article>
    </section>

    <section id="result-screen" class="hidden">
      <div class="card result-card">
        <p class="eyebrow">Test Complete</p>
        <h2 id="result-title"></h2>
        <p id="result-summary"></p>
        <div id="review-list" class="review-list"></div>
        <button id="retry-btn" class="primary">Retry Incorrect</button>
        <button id="new-btn" class="secondary">New Test</button>
      </div>
    </section>
  </main>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
