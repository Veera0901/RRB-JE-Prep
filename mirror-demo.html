<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>Mirror Lab — Concave & Convex</title>
<style>
:root{--bg:#090b10;--panel:rgba(17,21,29,.86);--line:rgba(255,255,255,.13);--text:#f7f8fb;--muted:#aab2c0;--accent:#7c6cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{height:100%;position:relative}
#camera{position:absolute;top:84px;right:14px;width:230px;height:307px;object-fit:cover;background:#111;border:1px solid rgba(255,255,255,.32);border-radius:18px;z-index:5;box-shadow:0 10px 30px #0009;transform:scaleX(-1)}
.camera-label{position:absolute;top:91px;right:28px;z-index:6;padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.48);font-size:8px;font-weight:800;color:#fff;pointer-events:none;backdrop-filter:blur(8px)}
#mirrorGL{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#mirrorRing{position:absolute;left:22%;top:19%;width:56%;aspect-ratio:1;border:2px solid rgba(255,255,255,.82);border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.06),inset 0 0 35px rgba(124,108,255,.16);pointer-events:none;z-index:2}#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 18%,transparent 68%,rgba(0,0,0,.58))}
header{position:absolute;top:0;left:0;right:0;height:74px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.title{font-size:17px;font-weight:850;letter-spacing:-.2px}.subtitle{font-size:10px;color:var(--muted);margin-top:2px}
.status{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(10,12,17,.55);backdrop-filter:blur(12px);font-size:11px;font-weight:800}
.dot{width:7px;height:7px;border-radius:50%;background:#7d8795}
.dot.live{background:#39d98a;box-shadow:0 0 9px #39d98a}
#start{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:18px;padding:15px 22px;background:#fff;color:#111;font-weight:850;font-size:15px;box-shadow:0 12px 40px #0009}
#start.hide{display:none}
#tip{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.48);backdrop-filter:blur(10px);font-size:10px;white-space:nowrap;color:#eef1f7;pointer-events:none}
.controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;padding:11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 15px 45px #0008}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:13px;background:rgba(255,255,255,.07)}
button{border:0;color:#fff;background:transparent;border-radius:10px;padding:10px 8px;font-size:12px;font-weight:850}
.segment button.active{background:#fff;color:#111}
.tools{display:flex;gap:7px;margin-top:8px}
.tool{flex:1;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.points{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px;padding:8px 6px 7px;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.075);box-shadow:inset 0 1px rgba(255,255,255,.05)}
.points:before{content:"";position:absolute;left:9%;right:9%;top:31px;height:2px;background:rgba(255,255,255,.25);border-radius:2px}
.point{position:relative;z-index:2;min-height:52px;background:rgba(255,255,255,.045);border:1px solid transparent;border-radius:12px;padding:7px 3px 6px;font-size:15px;color:#d2d7e0}
.point:after{content:"";display:block;width:10px;height:10px;margin:7px auto 0;border-radius:50%;background:#59616f;box-shadow:0 0 0 3px rgba(89,97,111,.16)}
.point.active{background:#fff;color:#111;border-color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.24)}
.point.active:after{background:#111;box-shadow:0 0 0 3px rgba(17,17,17,.14)}
.point small{display:block;margin-top:1px;font-size:8px;font-weight:750;letter-spacing:.1px;color:inherit;opacity:.62}
.point.active small{opacity:.7}
.tool:active,.point:active{transform:scale(.97)}
label{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:10px;font-weight:700}
label span:last-child{color:#fff;font-size:11px;font-weight:850}
input{width:100%;margin:4px 0 0;accent-color:var(--accent)}
#lesson{margin-top:7px;text-align:center;font-size:10px;color:#c1c7d2;line-height:1.35}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<canvas id="mirrorGL"></canvas>
<div id="shade"></div>
<header>
 <div><div class="title">Mirror Lab</div><div class="subtitle">Realtime curved-mirror experiment</div></div>
 <div class="status"><span id="dot" class="dot"></span><span id="status">Camera off</span></div>
</header>
<div id="mirrorRing" aria-hidden="true"></div><div class="camera-label">Original</div><div id="tip">Place your face/object inside the circle • move closer and farther</div>
<button id="start">📷 Start camera</button>
<section class="controls">
 <div class="segment" id="systemMode"><button id="mirrorMode" class="active">Mirror</button><button id="lensMode">Lens</button></div>
 <div class="segment" id="mirrorTypes"><button id="concave" class="active">Concave</button><button id="convex">Convex</button></div>
 <div class="segment" id="lensTypes" style="display:none"><button id="lensConvex" class="active">Convex lens</button><button id="lensConcave">Concave lens</button></div>
 <div class="tools"><button class="tool" id="flip">↔ Camera</button><button class="tool" id="reset">Reset mirror</button></div>
 <label><span>Object position</span><span id="distVal">C · 2F</span></label>
 <div class="points" id="points" aria-label="Optical object position">
  <button class="point" data-pos="infinity">∞<small>Far</small></button>
  <button class="point active" data-pos="C">C<small>2F</small></button>
  <button class="point" data-pos="F">F<small>Focus</small></button>
  <button class="point" data-pos="P">P<small>Pole</small></button>
 </div>
 <label><span>Curvature</span><span id="curvVal">55%</span></label>
 <input id="curv" type="range" min="15" max="90" value="55">
 <div id="lesson">At C (2F): real, inverted and same-size image forms at C.</div>
</section>
</div>
<script>
const video=document.getElementById('camera'),canvas=document.getElementById('mirrorGL');
const start=document.getElementById('start'),dot=document.getElementById('dot'),statusEl=document.getElementById('status');
const curv=document.getElementById('curv'),curvVal=document.getElementById('curvVal'),distVal=document.getElementById('distVal'),lesson=document.getElementById('lesson');
const points=document.querySelectorAll('.point');
const mirrorMode=document.getElementById('mirrorMode'),lensMode=document.getElementById('lensMode');
const mirrorTypes=document.getElementById('mirrorTypes'),lensTypes=document.getElementById('lensTypes');
const lensConvex=document.getElementById('lensConvex'),lensConcave=document.getElementById('lensConcave');
const gl=canvas.getContext('webgl',{alpha:true,antialias:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
let stream=null,facing='user',system='mirror',mode=0,mirror={x:.5,y:.47,r:.28},drag=null,tex,program,raf=0,objectDistance=2,objectPosition='C',videoTextureReady=false,loc={};

const VS=`
attribute vec2 p; varying vec2 uv;
void main(){gl_Position=vec4(p,0.,1.);uv=p*.5+.5;}
`;
const FS=`
precision mediump float;
uniform sampler2D videoTex;
uniform vec2 center;
uniform float radius;
uniform float strength;
uniform float aspect;
uniform float imageScale;
uniform float invertY;
uniform float videoAspect;
uniform float convexMode;
uniform float lensMode;
varying vec2 uv;
void main(){
 vec2 d=uv-center; d.x*=aspect;
 float rr=length(d); if(rr>radius){discard;}
 vec2 q=d/radius; float r=length(q);
 float k=1.0/(1.0+(convexMode>0.5 ? -strength : strength)*0.55*r*r);
 vec2 curved=q*k*imageScale;
 vec2 sampleScreen=center+vec2(curved.x/aspect,curved.y);
 // Reflect around the mirror's own optical axis, not the screen centre.
 if(lensMode<0.5){
   sampleScreen.x=center.x-(sampleScreen.x-center.x);
   if(invertY>0.5) sampleScreen.y=center.y-(sampleScreen.y-center.y);
 } else {
   // Lens: refract the image without mirror reflection.
   // Convex lens bends rays toward the optical axis; concave lens bends them away.
   float lensBend = (convexMode>0.5 ? -1.0 : 1.0) * strength * 0.34;
   float lensK = 1.0 + lensBend*r*r;
   vec2 lensOffset = q*(lensK-1.0)*0.55;
   sampleScreen = center + vec2((d.x + lensOffset.x*radius)/aspect, d.y + lensOffset.y*radius);
   if(invertY>0.5) sampleScreen.y=center.y-(sampleScreen.y-center.y);
 }
 // Match the phone's CSS object-fit: cover mapping.
 vec2 sampleUV=sampleScreen;
 if(aspect>videoAspect){ sampleUV.y=0.5+(sampleScreen.y-0.5)*(aspect/videoAspect); }
 else { sampleUV.x=0.5+(sampleScreen.x-0.5)*(videoAspect/aspect); }
 sampleUV=clamp(sampleUV,vec2(0.001),vec2(0.999));
 vec4 c=texture2D(videoTex,sampleUV);
 float edge=smoothstep(1.0,.82,r); c.rgb*=mix(.84,1.05,edge);
 gl_FragColor=c;
}
`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function init(){
 if(!gl)return;
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);
 gl.useProgram(program);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
 tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 loc.videoTex=gl.getUniformLocation(program,'videoTex');loc.center=gl.getUniformLocation(program,'center');loc.radius=gl.getUniformLocation(program,'radius');loc.strength=gl.getUniformLocation(program,'strength');loc.aspect=gl.getUniformLocation(program,'aspect');loc.imageScale=gl.getUniformLocation(program,'imageScale');loc.invertY=gl.getUniformLocation(program,'invertY');loc.videoAspect=gl.getUniformLocation(program,'videoAspect');loc.convexMode=gl.getUniformLocation(program,'convexMode');loc.lensMode=gl.getUniformLocation(program,'lensMode');
 gl.clearColor(0,0,0,0);
}
function updateRing(){const el=document.getElementById('mirrorRing');el.style.left=((mirror.x-mirror.r)*100)+'%';el.style.top=((mirror.y-mirror.r)*100)+'%';el.style.width=(mirror.r*2*100)+'%';} function resize(){const d=Math.min(devicePixelRatio||1,1.5),r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));draw()}
function draw(){
 if(!gl||!video.videoWidth)return;
 gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(program);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
 if(!videoTextureReady){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);videoTextureReady=true;}else{gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,video);}
 const q=+curv.value/100,rect=canvas.getBoundingClientRect();
 const aspect=rect.width/rect.height;
 let scale=1.0,inverted=0.0; let lensVirtual=0.0;
 const f=1.0,u=objectDistance;
 if(system==='lens'){ 
   const isConvex=mode===0;
   if(isConvex){
     if(objectPosition==='infinity'){scale=.22;inverted=1.0;}
     else if(objectPosition==='C'){scale=1.0;inverted=1.0;}
     else if(objectPosition==='F'){scale=2.6;inverted=1.0;}
     else {scale=2.1;inverted=0.0;lensVirtual=1.0;}
   }else{
     scale=.62; inverted=0.0; lensVirtual=1.0;
   }
 } else if(mode===0){
   if(objectPosition==='infinity'){scale=.28;inverted=1.0;}
   else if(objectPosition==='C'){scale=1.0;inverted=1.0;}
   else if(objectPosition==='F'){scale=2.8;inverted=1.0;}
   else {scale=2.2;inverted=0.0;}
 }else{
   if(objectPosition==='infinity')scale=.30;
   else if(objectPosition==='C')scale=.58;
   else if(objectPosition==='F')scale=.66;
   else scale=.74;
   inverted=0.0;
 }
 scale*=1.0+q*.18;
 gl.uniform1i(loc.videoTex,0);
 gl.uniform2f(loc.center,mirror.x,1-mirror.y);
 gl.uniform1f(loc.radius,mirror.r);
 gl.uniform1f(loc.strength,q);
 gl.uniform1f(loc.aspect,aspect);
 gl.uniform1f(loc.imageScale,scale);
 gl.uniform1f(loc.invertY,inverted);
 gl.uniform1f(loc.videoAspect,video.videoWidth/video.videoHeight);
gl.uniform1f(loc.convexMode,system==='mirror' ? (mode===1?1.0:0.0) : (mode===0?1.0:0.0));
 gl.uniform1f(loc.lensMode,system==='lens'?1.0:0.0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function videoFrame(){draw();if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(videoFrame);else raf=requestAnimationFrame(videoFrame)}
async function startCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});
  video.srcObject=stream;await video.play();start.classList.add('hide');dot.classList.add('live');statusEl.textContent='Camera live';videoFrame();
 }catch(e){statusEl.textContent='Camera blocked';start.textContent=e.name==='NotAllowedError'?'Allow camera access':'Camera unavailable'}
}
function updateLesson(){
 if(system==='lens'){
   if(mode===0){
     if(objectPosition==='infinity') lesson.textContent='Convex lens at ∞: real, inverted and highly diminished image forms near F.';
     else if(objectPosition==='C') lesson.textContent='Convex lens at 2F: real, inverted and same-size image forms at 2F.';
     else if(objectPosition==='F') lesson.textContent='Convex lens at F: refracted rays become parallel — image tends to infinity.';
     else lesson.textContent='Convex lens inside F: virtual, upright and magnified image forms on the object side.';
   }else lesson.textContent='Concave lens: virtual, upright and diminished image for all object positions.';
 }else{
   if(mode===1)lesson.textContent='Convex mirror: virtual, upright and reduced image for all positions.';
   else if(objectPosition==='infinity')lesson.textContent='At ∞: real, inverted and highly diminished image forms near F.';
   else if(objectPosition==='C')lesson.textContent='At C (2F): real, inverted and same-size image forms at C.';
   else if(objectPosition==='F')lesson.textContent='At F: reflected rays are nearly parallel — image moves toward infinity.';
   else lesson.textContent='At P: virtual, upright and magnified image forms behind the mirror.';
 }
}
function updateSystemUI(){
 const mt=document.getElementById('mirrorTypes'),lt=document.getElementById('lensTypes');
 mt.style.display=system==='mirror'?'grid':'none'; lt.style.display=system==='lens'?'grid':'none';
 mirrorMode.classList.toggle('active',system==='mirror'); lensMode.classList.toggle('active',system==='lens');
 distVal.textContent=system==='mirror'
   ? (objectPosition==='infinity'?'∞ · Far':objectPosition==='C'?'C · 2F':objectPosition==='F'?'F · Focus':'P · Pole')
   : (objectPosition==='infinity'?'∞ · Far':objectPosition==='C'?'2F':objectPosition==='F'?'F · Focus':'O · Optical');
 updateLesson(); draw();
}
function setMode(m){mode=m;updateLesson();draw()}
start.onclick=startCamera;
mirrorMode.onclick=()=>{system='mirror';setMode(0);updateSystemUI()};
lensMode.onclick=()=>{system='lens';setMode(0);updateSystemUI()};
concave.onclick=()=>setMode(0); convex.onclick=()=>setMode(1);
lensConvex.onclick=()=>setMode(0); lensConcave.onclick=()=>setMode(1);
document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCamera()};
document.getElementById('reset').onclick=()=>{mirror={x:.5,y:.47,r:.28};updateRing();draw()};
curv.oninput=()=>{curvVal.textContent=curv.value+'%';draw()};
points.forEach(btn=>btn.onclick=()=>{
 objectPosition=btn.dataset.pos;
 points.forEach(b=>b.classList.toggle('active',b===btn));
 distVal.textContent=objectPosition==='infinity'?'∞ · Far':objectPosition==='C'?'C · 2F':objectPosition==='F'?'F · Focus':'P · Pole';
 updateLesson();draw();
});
window.addEventListener('resize',resize);
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const dx=(x-mirror.x)*r.width/r.height,dy=y-mirror.y;if(Math.hypot(dx,dy)<mirror.r){drag={x,y,mx:mirror.x,my:mirror.y};canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();mirror.x=Math.max(mirror.r*r.height/r.width,Math.min(1-mirror.r*r.height/r.width,drag.mx+(e.clientX-r.left)/r.width-drag.x));mirror.y=Math.max(mirror.r,Math.min(1-mirror.r,drag.my+(e.clientY-r.top)/r.height-drag.y));updateRing();draw()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
init();updateRing();resize();setMode(0);
</script>
</body>
</html>
