<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0f">
<title>Mirror Lab — Optical Experiment</title>
<style>
:root{
 --bg:#07090e;--panel:#11151d;--panel2:#191e28;--line:rgba(255,255,255,.13);
 --text:#f7f8fb;--muted:#98a2b2;--accent:#7c6cff;--good:#35d58a
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}button,select,input{font:inherit}button{border:0;color:var(--text);touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#181c27 0,#0a0d13 52%,#06070b 100%)}

/* CAMERA / OPTICAL CANVAS */
#mirrorGL{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 30%,transparent 58%,rgba(0,0,0,.76))}
#mirrorRing{
 position:absolute;left:50%;top:40%;width:min(48vw,230px);aspect-ratio:1;
 transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.9);border-radius:50%;
 box-shadow:0 0 0 5px rgba(255,255,255,.045),0 0 45px rgba(124,108,255,.16),inset 0 0 42px rgba(124,108,255,.1);
 pointer-events:none;z-index:2
}

/* HEADER */
header{
 position:absolute;top:0;left:0;right:0;height:64px;padding:11px 16px 7px;
 display:flex;align-items:center;justify-content:space-between;z-index:30;
 background:linear-gradient(180deg,rgba(7,9,14,.98),rgba(7,9,14,.84),transparent)
}
.title{font-size:19px;font-weight:900;letter-spacing:-.4px}.subtitle{margin-top:2px;font-size:10px;color:var(--muted)}
.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(17,21,29,.82);font-size:11px;font-weight:850;backdrop-filter:blur(14px)}
.dot{width:8px;height:8px;border-radius:50%;background:#687180;box-shadow:0 0 0 4px rgba(104,113,128,.12)}
.dot.live{background:var(--good);box-shadow:0 0 0 4px rgba(53,213,138,.13),0 0 12px rgba(53,213,138,.45)}

/* TOP CONTROL STRIP */
.topBar{
 position:absolute;top:72px;left:12px;right:12px;height:55px;z-index:25;
 display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px
}
.topSelect{min-width:0;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:14px;background:rgba(18,22,30,.94);backdrop-filter:blur(16px);box-shadow:0 7px 22px rgba(0,0,0,.28)}
.topSelect span{display:block;margin-bottom:3px;color:var(--muted);font-size:7px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.topSelect select{width:100%;height:27px;padding:0 6px;border:0;outline:0;border-radius:9px;background:#202530;color:#fff;font-size:11px;font-weight:850;appearance:auto}
.topSelect select option{background:#181c24;color:#fff}

/* EXPERIMENT STAGE CARDS */
.rayGraph{
 position:absolute;top:140px;left:12px;width:calc(58% - 10px);height:155px;z-index:12;
 padding:9px;border:1px solid rgba(255,255,255,.16);border-radius:18px;
 background:rgba(8,11,17,.97);backdrop-filter:blur(18px);box-shadow:0 14px 35px rgba(0,0,0,.4)
}
.rayGraphTitle{font-size:11px;font-weight:900;margin-bottom:4px}.rayGraph svg{display:block;width:100%;height:125px}
.rayLabel{font-size:10px;fill:#aab2c0}.rayMain{stroke:#eef2f7;stroke-width:1.2}.rayAux{stroke:#7c6cff;stroke-width:1;stroke-dasharray:3 2}.rayObj{stroke:#fff;stroke-width:2}.rayImg{stroke:#39d98a;stroke-width:2}
#camera{
 position:absolute;top:140px;right:12px;width:calc(42% - 2px);height:155px;object-fit:cover;
 background:#111;border:1px solid rgba(255,255,255,.2);border-radius:18px;z-index:12;
 box-shadow:0 14px 35px rgba(0,0,0,.42);transform:scaleX(-1)
}
.camera-label{position:absolute;top:150px;right:21px;z-index:13;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.58);font-size:8px;font-weight:900;pointer-events:none}
#tip{position:absolute;left:50%;top:calc(39% + min(36vw,185px));transform:translateX(-50%);z-index:7;max-width:88%;padding:6px 10px;border-radius:999px;background:rgba(7,9,14,.65);color:#c0c6d1;font-size:9px;text-align:center;backdrop-filter:blur(8px)}
#start{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);z-index:20;padding:14px 22px;border-radius:18px;background:#fff;color:#111;font-size:14px;font-weight:900;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#start.hide{display:none}

/* SETTINGS SHEET */
.controls{
 position:absolute;left:10px;right:10px;bottom:9px;z-index:20;
 max-height:36vh;overflow:auto;padding:11px 12px 13px;
 border:1px solid rgba(255,255,255,.13);border-radius:22px;
 background:rgba(15,19,27,.98);backdrop-filter:blur(24px);box-shadow:0 20px 55px rgba(0,0,0,.62)
}
.sheetHandle{width:36px;height:4px;margin:0 auto 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.sectionTitle{margin:0 2px 6px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:10px;border-radius:14px;background:rgba(255,255,255,.055)}
.segment button{min-height:43px;border-radius:11px;background:transparent;font-size:12px;font-weight:900}
.segment button.active{background:#fff;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.22)}
label.controlLabel{display:flex;align-items:center;justify-content:space-between;margin:9px 2px 5px;color:var(--muted);font-size:10px;font-weight:800}
.controlLabel span:last-child{color:#fff;font-size:11px;font-weight:900}
.points{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(255,255,255,.045)}
.points:before{content:"";position:absolute;left:9%;right:9%;top:34px;height:2px;background:rgba(255,255,255,.2)}
.point{position:relative;z-index:2;min-height:59px;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.035);font-size:16px;font-weight:900;color:#d7dbe2}
.point small{display:block;margin-top:1px;font-size:8px;font-weight:800;color:inherit;opacity:.6}
.point:after{content:"";display:block;width:10px;height:10px;margin:7px auto 0;border-radius:50%;background:#59616f;box-shadow:0 0 0 3px rgba(89,97,111,.14)}
.point.active{background:#fff;color:#111;box-shadow:0 5px 16px rgba(0,0,0,.25)}.point.active:after{background:#111;box-shadow:0 0 0 3px rgba(17,17,17,.12)}
input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--accent)}
#lesson{margin-top:9px;padding:8px 10px;border-radius:11px;text-align:center;background:rgba(124,108,255,.08);border:1px solid rgba(124,108,255,.13);color:#c5c9d3;font-size:9px;line-height:1.4}

@media(max-width:390px){
 header{padding-left:13px;padding-right:13px}.title{font-size:17px}
 .topBar{top:70px;left:9px;right:9px;gap:5px}.topSelect{padding:6px}.topSelect span{font-size:6px}.topSelect select{font-size:10px}
 .rayGraph{top:134px;left:9px;width:calc(58% - 7px);height:145px;padding:8px}.rayGraph svg{height:116px}
 #camera{top:134px;right:9px;width:calc(42% - 2px);height:145px}.camera-label{top:143px;right:16px}
 #mirrorRing{top:39%;width:min(44vw,190px)}
 #tip{top:calc(39% + 105px);font-size:8px}
 .controls{left:8px;right:8px;bottom:8px;max-height:35vh;padding:10px}
 .point{min-height:54px}
}
</style><body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<canvas id="mirrorGL"></canvas>
<div id="shade"></div>

<header>
 <div><div class="title">Mirror Lab</div><div class="subtitle">Realtime optical experiment</div></div>
 <div class="status"><span id="dot" class="dot"></span><span id="status">Camera off</span></div>
</header>

<div class="topBar">
 <label class="topSelect"><span>Optical device</span><select id="systemSelect" aria-label="Optical device"><option value="mirror">Mirror</option><option value="lens">Lens</option></select></label>
 <label class="topSelect"><span>View</span><select id="viewSelect" aria-label="View"><option value="person">👤 People focus</option><option value="scene">🌐 Full scene</option></select></label>
 <label class="topSelect"><span>Actions</span><select id="actionSelect" aria-label="Actions"><option value="">Choose</option><option value="camera">↔ Camera</option><option value="reset">↻ Reset</option></select></label>
</div>

<div id="mirrorRing" aria-hidden="true"></div>

<div class="rayGraph" id="rayGraph">
 <div class="rayGraphTitle">Position & ray diagram</div>
 <svg viewBox="0 0 180 112" aria-label="Optical position diagram">
  <line x1="8" y1="62" x2="172" y2="62" class="rayMain"/>
  <line x1="118" y1="15" x2="118" y2="98" class="rayMain"/>
  <circle cx="70" cy="62" r="3" fill="#7c6cff"/><circle cx="92" cy="62" r="3" fill="#7c6cff"/>
  <text x="65" y="76" class="rayLabel">F</text><text x="84" y="76" class="rayLabel">C / 2F</text>
  <path id="opticalSurface" d="M118 18 Q92 62 118 106" fill="none" stroke="#fff" stroke-width="3"/>
  <line id="rayObject" x1="42" y1="62" x2="42" y2="30" class="rayObj"/>
  <polygon id="objectArrow" points="42,26 38,34 46,34" fill="#fff"/>
  <line id="rayImage" x1="94" y1="62" x2="94" y2="38" class="rayImg"/>
  <polygon id="imageArrow" points="94,34 90,42 98,42" fill="#39d98a"/>
  <line x1="42" y1="30" x2="118" y2="30" class="rayAux"/>
  <line x1="118" y1="30" x2="94" y2="38" class="rayAux"/>
  <text id="rayType" x="8" y="13" class="rayLabel">Concave mirror</text>
 </svg>
</div>
<div class="camera-label">Original</div>

<div id="tip">Place your face or object inside the circle</div>
<button id="start">📷 Start camera</button>

<section class="controls">
 <div class="sheetHandle"></div>
 <div class="sectionTitle" id="deviceTypeTitle">Mirror type</div>
 <div class="segment" id="mirrorTypes"><button id="concave" class="active">Concave</button><button id="convex">Convex</button></div>
 <div class="segment" id="lensTypes" style="display:none"><button id="lensConvex" class="active">Convex lens</button><button id="lensConcave">Concave lens</button></div>

 <label class="controlLabel"><span>Object position</span><span id="distVal">C · 2F</span></label>
 <div class="points" id="points" aria-label="Optical object position">
  <button class="point" data-pos="infinity">∞<small>Far</small></button>
  <button class="point active" data-pos="C">C<small>2F</small></button>
  <button class="point" data-pos="F">F<small>Focus</small></button>
  <button class="point" data-pos="P">P<small>Pole</small></button>
 </div>

 <label class="controlLabel"><span>Curvature</span><span id="curvVal">55%</span></label>
 <input id="curv" type="range" min="15" max="90" value="55">
 <div id="lesson">At C (2F): real, inverted and same-size image forms at C.</div>
</section>
</div><script>
const $=id=>document.getElementById(id);
const video=$('camera'),canvas=$('mirrorGL'),start=$('start'),dot=$('dot'),statusEl=$('status');
const systemSelect=$('systemSelect'),viewSelect=$('viewSelect'),actionSelect=$('actionSelect');
const mirrorTypes=$('mirrorTypes'),lensTypes=$('lensTypes'),concave=$('concave'),convex=$('convex'),lensConvex=$('lensConvex'),lensConcave=$('lensConcave');
const pointsEl=$('points'),distVal=$('distVal'),lesson=$('lesson'),curv=$('curv'),curvVal=$('curvVal');
let state={device:'mirror',type:0,view:'person',position:'C',facing:'user',stream:null,mirror:{x:.5,y:.47,r:.28}};
let points=[];
const gl=canvas.getContext('webgl',{alpha:true,antialias:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
let tex,program,videoTextureReady=false,loc={},drag=null;

const VS=`attribute vec2 p;varying vec2 uv;void main(){gl_Position=vec4(p,0.,1.);uv=p*.5+.5;}`;
const FS=`precision mediump float;
uniform sampler2D videoTex;uniform vec2 center;uniform float radius;uniform float strength;uniform float aspect;
uniform float imageScale;uniform float invertY;uniform float videoAspect;uniform float convexMode;uniform float lensMode;
varying vec2 uv;
void main(){
 vec2 d=uv-center;d.x*=aspect;float rr=length(d);if(rr>radius)discard;
 vec2 q=d/radius;float r=length(q);
 float k=1.0/(1.0+(convexMode>.5?-strength:strength)*.55*r*r);
 vec2 curved=q*k*imageScale;vec2 sampleScreen=center+vec2(curved.x/aspect,curved.y);
 if(lensMode<.5){sampleScreen.x=center.x-(sampleScreen.x-center.x);if(invertY>.5)sampleScreen.y=center.y-(sampleScreen.y-center.y);}
 else{float bend=(convexMode>.5?-1.0:1.0)*strength*.34;float lk=1.0+bend*r*r;vec2 off=q*(lk-1.0)*.55;sampleScreen=center+vec2((d.x+off.x*radius)/aspect,d.y+off.y*radius);if(invertY>.5)sampleScreen.y=center.y-(sampleScreen.y-center.y);}
 vec2 su=sampleScreen;if(aspect>videoAspect)su.y=.5+(sampleScreen.y-.5)*(aspect/videoAspect);else su.x=.5+(sampleScreen.x-.5)*(videoAspect/aspect);
 su=clamp(su,vec2(.001),vec2(.999));vec4 color=texture2D(videoTex,su);float edge=smoothstep(1.,.82,r);color.rgb*=mix(.84,1.05,edge);gl_FragColor=color;
}`;

function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function initGL(){
 if(!gl)return;
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);gl.useProgram(program);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
 tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 ['videoTex','center','radius','strength','aspect','imageScale','invertY','videoAspect','convexMode','lensMode'].forEach(n=>loc[n]=gl.getUniformLocation(program,n));
}
function resize(){if(!gl)return;const d=Math.min(devicePixelRatio||1,1.5),r=canvas.getBoundingClientRect();canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);draw()}
function draw(){
 if(!gl||!video.videoWidth)return;
 const r=canvas.getBoundingClientRect(),aspect=r.width/r.height,q=+curv.value/100;
 gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
 if(!videoTextureReady){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);videoTextureReady=true}else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,video);
 let scale=1,invert=0;
 const p=state.position;
 if(state.device==='mirror'&&state.type===0){
  if(p==='infinity')scale=.22,invert=1;else if(p==='beyondC')scale=.55,invert=1;else if(p==='C')scale=1,invert=1;else if(p==='betweenCF')scale=1.75,invert=1;else if(p==='F')scale=2.5,invert=1;else scale=2.1;
 }else if(state.device==='mirror'){scale=p==='infinity'?.3:.55}
 else if(state.type===0){
  if(p==='infinity')scale=.22,invert=1;else if(p==='beyond2F')scale=.55,invert=1;else if(p==='2F')scale=1,invert=1;else if(p==='betweenF2F')scale=1.7,invert=1;else if(p==='F')scale=2.5,invert=1;else scale=2.1;
 }else scale=.62;
 scale*=1+q*.18;
 gl.uniform1i(loc.videoTex,0);gl.uniform2f(loc.center,state.mirror.x,1-state.mirror.y);gl.uniform1f(loc.radius,state.mirror.r);gl.uniform1f(loc.strength,q);gl.uniform1f(loc.aspect,aspect);gl.uniform1f(loc.imageScale,scale);gl.uniform1f(loc.invertY,invert);gl.uniform1f(loc.videoAspect,video.videoWidth/video.videoHeight);gl.uniform1f(loc.convexMode,state.device==='mirror'?(state.type?1:0):(state.type?0:1));gl.uniform1f(loc.lensMode,state.device==='lens'?1:0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function frame(){draw();if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(frame);}

const positionSets={
 mirrorConcave:[['infinity','∞','Far'],['beyondC','>C','Beyond C'],['C','C','At C'],['betweenCF','C–F','Between'],['F','F','Focus'],['insideF','F–P','Between']],
 mirrorConvex:[['infinity','∞','Far'],['betweenPF','P–∞','Any position']],
 lensConvex:[['infinity','∞','Far'],['beyond2F','>2F','Beyond 2F'],['2F','2F','At 2F'],['betweenF2F','F–2F','Between'],['F','F','Focus'],['insideF','O–F','Inside F']],
 lensConcave:[['infinity','∞','Far'],['insideF','O–F','Any position']]
};
function positionSet(){
 if(state.device==='mirror')return state.type===0?positionSets.mirrorConcave:positionSets.mirrorConvex;
 return state.type===0?positionSets.lensConvex:positionSets.lensConcave;
}
function positionName(){const d=positionSet().find(x=>x[0]===state.position);return d?d[2]:'Object position'}
function renderPositions(){
 const defs=positionSet();if(!defs.some(x=>x[0]===state.position))state.position=defs[0][0];
 pointsEl.innerHTML=defs.map(x=>'<button class="point '+(x[0]===state.position?'active':'')+'" data-pos="'+x[0]+'">'+x[1]+'<small>'+x[2]+'</small></button>').join('');
 points=[...pointsEl.querySelectorAll('.point')];
 points.forEach(b=>b.onclick=()=>{state.position=b.dataset.pos;renderPositions();renderAll()});
 distVal.textContent=positionName();
}
function updateLesson(){
 const p=state.position;
 if(state.device==='mirror'){
  if(state.type===0){
   lesson.textContent={infinity:'At infinity: real, inverted and highly diminished image forms at F.',beyondC:'Beyond C: real, inverted and diminished image forms between F and C.',C:'At C: real, inverted and same-size image forms at C.',betweenCF:'Between C and F: real, inverted and magnified image forms beyond C.',F:'At F: reflected rays are parallel; image forms at infinity.',insideF:'Between F and P: virtual, upright and magnified image forms behind the mirror.'}[p];
  }else lesson.textContent=p==='infinity'?'At infinity: virtual, upright and diminished image forms near F behind the mirror.':'Convex mirror: virtual, upright and diminished image forms behind the mirror.';
 }else if(state.type===0){
  lesson.textContent={infinity:'At infinity: real, inverted and highly diminished image forms near F₂.',beyond2F:'Beyond 2F₁: real, inverted and diminished image forms between F₂ and 2F₂.',2F:'At 2F₁: real, inverted and same-size image forms at 2F₂.',betweenF2F:'Between F₁ and 2F₁: real, inverted and magnified image forms beyond 2F₂.',F:'At F₁: refracted rays are parallel; image forms at infinity.',insideF:'Inside F₁: virtual, upright and magnified image forms on the object side.'}[p];
 }else lesson.textContent='Concave lens: virtual, upright and diminished image for all object positions.';
}
function updateRayGraph(){
 const type=$('rayType'),surface=$('opticalSurface'),obj=$('rayObject'),img=$('rayImage'),oa=$('objectArrow'),ia=$('imageArrow'),dots=[...document.querySelectorAll('.rayGraph circle')],labs=[...document.querySelectorAll('.rayLabel')];
 let ox=40,oh=23,ix=90,ih=15,virtual=false;
 if(state.device==='mirror'&&state.type===0){
  const m={infinity:[18,8,70,6],beyondC:[30,17,82,11],C:[42,23,42,23],betweenCF:[52,31,140,36],F:[58,27,160,5],insideF:[68,24,145,28]}[state.position]||[42,23,42,23];[ox,oh,ix,ih]=m;virtual=state.position==='insideF';type.textContent='Concave mirror';surface.setAttribute('d','M118 18 Q92 62 118 106');
 }else if(state.device==='mirror'){
  [ox,oh,ix,ih]=state.position==='infinity'?[18,8,138,6]:[40,24,138,13];virtual=true;type.textContent='Convex mirror';surface.setAttribute('d','M118 18 Q144 62 118 106');
 }else if(state.type===0){
  const m={infinity:[18,8,158,6],beyond2F:[30,18,166,11],2F:[48,23,170,23],betweenF2F:[65,32,178,36],F:[78,27,170,5],insideF:[95,25,92,38]}[state.position]||[48,23,170,23];[ox,oh,ix,ih]=m;virtual=state.position==='insideF';type.textContent='Convex lens';surface.setAttribute('d','M118 18 Q106 62 118 106');
 }else{[ox,oh,ix,ih]=[42,23,101,12];virtual=true;type.textContent='Concave lens';surface.setAttribute('d','M118 18 Q130 62 118 106')}
 obj.setAttribute('x1',ox);obj.setAttribute('x2',ox);obj.setAttribute('y1',62);obj.setAttribute('y2',62-oh);oa.setAttribute('points',ox+','+(62-oh-5)+' '+(ox-4)+','+(62-oh+3)+' '+(ox+4)+','+(62-oh+3));
 img.setAttribute('x1',ix);img.setAttribute('x2',ix);img.setAttribute('y1',62);img.setAttribute('y2',62-ih);ia.setAttribute('points',ix+','+(62-ih-5)+' '+(ix-4)+','+(62-ih+3)+' '+(ix+4)+','+(62-ih+3));
 if(dots[0]){dots[0].setAttribute('cx',state.device==='lens'?78:(state.type?138:70));dots[0].setAttribute('cy',62)}
 if(dots[1]){dots[1].setAttribute('cx',state.device==='lens'?48:(state.type?158:92));dots[1].setAttribute('cy',62)}
 labs.forEach((x,i)=>{if(i===1)x.textContent=state.device==='lens'?'F₁':'F';if(i===2)x.textContent=state.device==='lens'?'2F₁':'C / 2F'});
}
function updateDevice(){
 mirrorTypes.style.display=state.device==='mirror'?'grid':'none';lensTypes.style.display=state.device==='lens'?'grid':'none';
 $('deviceTypeTitle').textContent=state.device==='mirror'?'Mirror type':'Lens type';
 systemSelect.value=state.device;viewSelect.value=state.view;renderPositions();updateLesson();updateRayGraph();draw();
}
function renderAll(){updateDevice()}
systemSelect.onchange=()=>{state.device=systemSelect.value;state.type=0;state.position=positionSet()[0][0];renderAll()};
viewSelect.onchange=()=>{state.view=viewSelect.value;draw()};
actionSelect.onchange=()=>{
 if(actionSelect.value==='camera'){state.facing=state.facing==='user'?'environment':'user';startCamera()}
 if(actionSelect.value==='reset'){state.mirror={x:.5,y:.47,r:.28};updateRing();draw()}
 actionSelect.value='';
};
concave.onclick=()=>{state.device='mirror';state.type=0;renderAll()};
convex.onclick=()=>{state.device='mirror';state.type=1;renderAll()};
lensConvex.onclick=()=>{state.device='lens';state.type=0;renderAll()};
lensConcave.onclick=()=>{state.device='lens';state.type=1;renderAll()};
curv.oninput=()=>{curvVal.textContent=curv.value+'%';draw()};

async function startCamera(){
 if(state.stream)state.stream.getTracks().forEach(t=>t.stop());
 try{
  state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});
  video.srcObject=state.stream;await video.play();start.classList.add('hide');dot.classList.add('live');statusEl.textContent='Camera live';videoTextureReady=false;frame();
 }catch(e){statusEl.textContent='Camera blocked';start.textContent=e.name==='NotAllowedError'?'Allow camera access':'Camera unavailable'}
}
start.onclick=startCamera;
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const dx=(x-state.mirror.x)*r.width/r.height,dy=y-state.mirror.y;if(Math.hypot(dx,dy)<state.mirror.r){drag={x,y,mx:state.mirror.x,my:state.mirror.y};canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();state.mirror.x=Math.max(state.mirror.r*r.height/r.width,Math.min(1-state.mirror.r*r.height/r.width,drag.mx+(e.clientX-r.left)/r.width-drag.x));state.mirror.y=Math.max(state.mirror.r,Math.min(1-state.mirror.r,drag.my+(e.clientY-r.top)/r.height-drag.y));updateRing();draw()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('resize',resize);
initGL();renderAll();updateRing();resize();
</script>
</body>
</html>
